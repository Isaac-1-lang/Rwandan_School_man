<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, rgba(244, 247, 252, 0.8), rgba(224, 231, 255, 0.8)), 
                        url("https://images.unsplash.com/photo-1585435557343-3b0929e91f93?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            color: #3400ff;
            text-align: center;
            margin-bottom: 20px;
        }
        h1 span { color: #5721fb; }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .stat-card h3 { color: #3400ff; font-size: 1.2rem; margin-bottom: 10px; }
        .stat-card span { font-size: 2rem; font-weight: 600; color: #5721fb; }
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        .card a {
            color: #3400ff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
        }
        .card a:hover { text-decoration: underline; }
        .card span { color: #666; font-size: 0.9rem; display: block; }
        .logout-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .logout-btn:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Doctor <span>Dashboard</span></h1>
        <div class="stats-container">
            <div class="stat-card">
                <h3>Total Students</h3>
                <span>1,245</span>
            </div>
            <div class="stat-card">
                <h3>Checkups Today</h3>
                <span>15</span>
            </div>
            <div class="stat-card">
                <h3>Health Alerts</h3>
                <span>3</span>
            </div>
        </div>
        <div class="card-container">
            <div class="card">
                <a href="marks.html">View Health Scores</a>
                <span>Monitor student health metrics</span>
            </div>
            <div class="card">
                <a href="health-records.html">Health Records</a>
                <span>Manage student medical history</span>
            </div>
            <div class="card">
                <a href="appointments.html">Appointments</a>
                <span>Schedule student checkups</span>
            </div>
            <div class="card">
                <a href="report.html">Generate Reports</a>
                <span>Create health report cards</span>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <script>
        function logout() {
            if (confirm("Are you sure you want to logout?")) {
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
