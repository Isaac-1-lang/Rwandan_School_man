<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discipline Management</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            padding: 20px;
            background: linear-gradient(135deg, #f4f7fc, #e0e7ff);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #3400ff;
            font-weight: 600;
        }

        .nav-links a, .nav-links button {
            padding: 10px 20px;
            background: #3400ff;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            margin-left: 10px;
            transition: background 0.3s ease;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links button:hover {
            background: #5721fb;
        }

        .filter-container {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-input, .class-filter {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            width: 100%;
            max-width: 400px;
        }

        .search-input:focus, .class-filter:focus {
            border-color: #3400ff;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 0, 255, 0.2);
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background: linear-gradient(135deg, #3400ff, #5721fb);
            color: white;
            font-weight: 500;
        }

        tr:hover {
            background-color: #f8f9ff;
            transition: background 0.3s ease;
        }

        .action-buttons button {
            padding: 5px 10px;
            margin: 0 5px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .edit-btn {
            background: #3498db;
            color: white;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .send-btn {
            background: #2ecc71;
            color: white;
        }

        .edit-btn:hover {
            background: #2980b9;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .send-btn:hover {
            background: #27ae60;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .student-table {
                display: block;
                overflow-x: auto;
            }
            
            .header {
                flex-direction: column;
                text-align: center;
            }

            .search-input, .class-filter {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Discipline Management</h1>
            <div class="nav-links">
                <button id="addStudentBtn">Add Student</button>
            </div>
        </div>
        
        <div class="filter-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search by student name...">
            <select class="class-filter" id="classFilter">
                <option value="">All Classes</option>
                <option value="S1">S1</option>
                <option value="S2">S2</option>
                <option value="S3">S3</option>
                <option value="S4">S4</option>
                <option value="S5">S5</option>
                <option value="S6">S6</option>
            </select>
        </div>

        <table class="student-table" id="studentTable">
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Class</th>
                <th>First Term (Marks/40)</th>
                <th>Second Term (Marks/40)</th>
                <th>Last Term (Marks/40)</th>
                <th>Total (Marks/120)</th>
                <th>Comments</th>
                <th>Actions</th>
            </tr>
            <tr>
                <td>John</td>
                <td>Doe</td>
                <td>S1 A</td>
                <td>35</td>
                <td>38</td>
                <td>36</td>
                <td>109</td>
                <td>Excellent behavior</td>
                <td class="action-buttons">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                    <button class="send-btn">Send</button>
                </td>
            </tr>
            <tr>
                <td>Alice</td>
                <td>Mugabe</td>
                <td>S1 B</td>
                <td>30</td>
                <td>32</td>
                <td>34</td>
                <td>96</td>
                <td>Needs improvement</td>
                <td class="action-buttons">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                    <button class="send-btn">Send</button>
                </td>
            </tr>
        </table>
    </div>

    <div class="modal" id="studentModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add/Edit Student</h2>
            <form id="studentForm">
                <input type="text" id="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" placeholder="Last Name" required>
                <input type="text" id="class" placeholder="Class (e.g., S1 A)" required>
                <input type="number" id="firstTerm" placeholder="First Term Marks (max 40)" max="40" required>
                <input type="number" id="secondTerm" placeholder="Second Term Marks (max 40)" max="40" required>
                <input type="number" id="lastTerm" placeholder="Last Term Marks (max 40)" max="40" required>
                <textarea id="comments" placeholder="Comments"></textarea>
                <div class="modal-buttons">
                    <button type="submit">Save</button>
                    <button type="button" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="sendModal">
        <div class="modal-content">
            <h2>Send Discipline Report</h2>
            <form id="sendForm">
                <input type="text" id="studentName" placeholder="Student Name" readonly>
                <input type="text" id="studentClass" placeholder="Class" readonly>
                <input type="text" id="totalMarks" placeholder="Total Marks" readonly>
                <input type="email" id="dosEmail" placeholder="DOS Email" required>
                <input type="email" id="parentEmail" placeholder="Parent Email" required>
                <textarea id="advice" placeholder="Advice to DOS and Parents" rows="5" required></textarea>
                <div class="modal-buttons">
                    <button type="submit">Send</button>
                    <button type="button" id="cancelSendBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let editRow = null;

        // Filter functionality
        const searchInput = document.getElementById('searchInput');
        const classFilter = document.getElementById('classFilter');
        const studentTable = document.getElementById('studentTable');

        function filterTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const classTerm = classFilter.value;
            const rows = studentTable.querySelectorAll('tr:not(:first-child)');

            rows.forEach(row => {
                const firstName = row.cells[0].textContent.toLowerCase();
                const lastName = row.cells[1].textContent.toLowerCase();
                const fullName = `${firstName} ${lastName}`;
                const studentClass = row.cells[2].textContent;

                const matchesName = fullName.includes(searchTerm);
                const matchesClass = classTerm === '' || studentClass.startsWith(classTerm);

                if (matchesName && matchesClass) {
                    row.classList.remove('hidden');
                } else {
                    row.classList.add('hidden');
                }
            });
        }

        searchInput.addEventListener('input', filterTable);
        classFilter.addEventListener('change', filterTable);

        // CRUD functionality
        const studentModal = document.getElementById('studentModal');
        const studentForm = document.getElementById('studentForm');
        const addStudentBtn = document.getElementById('addStudentBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const modalTitle = document.getElementById('modalTitle');

        addStudentBtn.addEventListener('click', () => {
            editRow = null;
            modalTitle.textContent = 'Add Student';
            studentForm.reset();
            studentModal.style.display = 'block';
        });

        cancelBtn.addEventListener('click', () => {
            studentModal.style.display = 'none';
        });

        studentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const data = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                class: document.getElementById('class').value,
                firstTerm: document.getElementById('firstTerm').value,
                secondTerm: document.getElementById('secondTerm').value,
                lastTerm: document.getElementById('lastTerm').value,
                total: parseInt(document.getElementById('firstTerm').value) + 
                       parseInt(document.getElementById('secondTerm').value) + 
                       parseInt(document.getElementById('lastTerm').value),
                comments: document.getElementById('comments').value
            };

            if (editRow) {
                editRow.cells[0].textContent = data.firstName;
                editRow.cells[1].textContent = data.lastName;
                editRow.cells[2].textContent = data.class;
                editRow.cells[3].textContent = data.firstTerm;
                editRow.cells[4].textContent = data.secondTerm;
                editRow.cells[5].textContent = data.lastTerm;
                editRow.cells[6].textContent = data.total;
                editRow.cells[7].textContent = data.comments;
            } else {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${data.firstName}</td>
                    <td>${data.lastName}</td>
                    <td>${data.class}</td>
                    <td>${data.firstTerm}</td>
                    <td>${data.secondTerm}</td>
                    <td>${data.lastTerm}</td>
                    <td>${data.total}</td>
                    <td>${data.comments}</td>
                    <td class="action-buttons">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                        <button class="send-btn">Send</button>
                    </td>
                `;
                studentTable.appendChild(row);
            }

            studentModal.style.display = 'none';
            studentForm.reset();
            filterTable();
        });

        // Send functionality
        const sendModal = document.getElementById('sendModal');
        const sendForm = document.getElementById('sendForm');
        const cancelSendBtn = document.getElementById('cancelSendBtn');

        studentTable.addEventListener('click', (e) => {
            const row = e.target.closest('tr');
            if (!row) return;

            if (e.target.classList.contains('edit-btn')) {
                editRow = row;
                modalTitle.textContent = 'Edit Student';
                document.getElementById('firstName').value = row.cells[0].textContent;
                document.getElementById('lastName').value = row.cells[1].textContent;
                document.getElementById('class').value = row.cells[2].textContent;
                document.getElementById('firstTerm').value = row.cells[3].textContent;
                document.getElementById('secondTerm').value = row.cells[4].textContent;
                document.getElementById('lastTerm').value = row.cells[5].textContent;
                document.getElementById('comments').value = row.cells[7].textContent;
                studentModal.style.display = 'block';
            } else if (e.target.classList.contains('delete-btn')) {
                if (confirm('Are you sure you want to delete this student?')) {
                    row.remove();
                }
            } else if (e.target.classList.contains('send-btn')) {
                document.getElementById('studentName').value = `${row.cells[0].textContent} ${row.cells[1].textContent}`;
                document.getElementById('studentClass').value = row.cells[2].textContent;
                document.getElementById('totalMarks').value = row.cells[6].textContent;
                sendForm.reset();
                document.getElementById('studentName').disabled = true;
                document.getElementById('studentClass').disabled = true;
                document.getElementById('totalMarks').disabled = true;
                sendModal.style.display = 'block';
            }
        });

        cancelSendBtn.addEventListener('click', () => {
            sendModal.style.display = 'none';
        });

        sendForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const studentName = document.getElementById('studentName').value;
            const studentClass = document.getElementById('studentClass').value;
            const totalMarks = document.getElementById('totalMarks').value;
            const dosEmail = document.getElementById('dosEmail').value;
            const parentEmail = document.getElementById('parentEmail').value;
            const advice = document.getElementById('advice').value;

            // Simulate email sending (replace with actual email implementation)
            const mailtoLink = `mailto:${dosEmail},${parentEmail}?subject=Discipline Report for ${studentName}&body=Dear DOS and Parents,%0D%0A%0D%0AHere is the discipline report for ${studentName} (${studentClass}):%0D%0ATotal Marks: ${totalMarks}/120%0D%0A%0D%0AAdvice:%0D%0A${advice}%0D%0A%0D%0ARegards,%0D%0ADiscipline Management`;
            window.location.href = mailtoLink;

            alert(`Report prepared for sending to ${dosEmail} and ${parentEmail}`);
            sendModal.style.display = 'none';
        });
    </script>
</body>
</html>
