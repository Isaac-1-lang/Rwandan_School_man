<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Doctors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: url('https://images.unsplash.com/photo-1576091160550-2173dba999ef') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Overlay for readability */
            z-index: -1;
        }

        .side-menu {
            width: 250px;
            background: linear-gradient(135deg, #3400ff, #5721fb);
            color: white;
            padding: 20px;
            height: 100vh;
            position: fixed;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .side-menu .title h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .side-menu ul {
            list-style: none;
        }

        .side-menu ul li {
            margin: 20px 0;
        }

        .side-menu ul li a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .side-menu ul li a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .side-menu ul li a img {
            width: 24px;
            margin-right: 10px;
        }

        .container {
            margin-left: 250px;
            flex: 1;
            padding: 30px;
            position: relative;
        }

        .header {
            position: absolute;
            top: 30px;
            right: 30px;
        }

        .nav .user {
            display: flex;
            gap: 20px;
        }

        .nav .user a img {
            width: 30px;
            transition: transform 0.3s ease;
            filter: brightness(0) invert(1); /* White icons on dark background */
        }

        .nav .user a img:hover {
            transform: scale(1.1);
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 60px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .card-content h1 {
            font-size: 1.5rem;
            color: #3400ff;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card-content a {
            text-decoration: none;
            color: inherit;
        }

        .card-content a:hover {
            color: #5721fb;
        }

        .card-content p {
            color: #666;
            font-size: 1rem;
        }

        .card-content .specialty {
            color: #2ecc71;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Mobile Menu Toggle */
        #check {
            display: none;
        }

        #btn, #cancel {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            width: 30px;
            cursor: pointer;
            z-index: 1100;
            filter: brightness(0) invert(1); /* White icons */
        }

        @media (max-width: 768px) {
            .side-menu {
                transform: translateX(-100%);
            }

            .container {
                margin-left: 0;
            }

            #btn {
                display: block;
            }

            #check:checked ~ .side-menu {
                transform: translateX(0);
            }

            #check:checked ~ #btn {
                display: none;
            }

            #check:checked ~ #cancel {
                display: block;
            }

            .header {
                top: 70px;
            }

            .card-container {
                margin-top: 100px;
            }
        }
    </style>
</head>
<body>
    <input type="checkbox" id="check">
    <label for="check">
        <img src="./files/Menu.png" id="btn" alt="Menu">
        <img src="./files/Cancel.png" id="cancel" alt="Close">
    </label>

    <div class="side-menu">
        <div class="title">
            <h1>School</h1>
        </div>
        <ul>
            <li><a href="#"><img src="./files/Reading.png" alt="Students"> Students</a></li>
            <li><a href="./teacher/PROJECT/teacher.html"><img src="./files/Teacher.png" alt="Teachers"> Teachers</a></li>
            <li><a href="choose.html"><img src="./files/Medical Doctor.png" alt="Doctors"> Doctors</a></li>
            <li><a href="./teacher/PROJECT/discipline.html"><img src="./files/Soccer Yellow Card.png" alt="Disciplinary"> Disciplinary</a></li>
            <li><a href="index.html"><img src="./files/Home.png" alt="Home"> Home</a></li>
        </ul>
    </div>

    <div class="container">
        <div class="header">
            <div class="nav">
                <div class="user">
                    <a href="#"><img src="./files/Notification.png" alt="Notifications"></a>
                    <a href="#"><img src="./files/user.png" alt="Profile"></a>
                </div>
            </div>
        </div>

        <div class="card-container">
            <div class="card">
                <div class="card-content">
                    <img src="./files/Premium Photo _ Portrait of african american practitioner nurse smiling at camera working at illness expertise.jpg" alt="Dr. Uwamahoro">
                    <a href="doctor_insight.html">
                        <h1>UWAMAHORO Justine</h1>
                    </a>
                    <p>Doctor</p>
                    <p class="specialty">Pediatrics</p>
                </div>
            </div>
            <div class="card">
                <div class="card-content">
                    <img src="./files/download.jpg" alt="Dr. Muhira">
                    <a href="anndo_insight.htm">
                        <h1>Muhira Joshua</h1>
                    </a>
                    <p>Doctor</p>
                    <p class="specialty">General Medicine</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
